<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arène 3D — Démo</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
<style>
  html, body { margin:0; height:100%; background:#0d0508; overflow:hidden; font:14px Arial; color:#fff; }
  #gl { position:relative; height:100vh; aspect-ratio:9/16; max-width:100vw; margin:0 auto; }
  #bar { position:fixed; left:8px; top:8px; display:flex; gap:6px; flex-wrap:wrap; z-index:5; max-width:60vw; }
  button { background:#000c; color:#fff; border:1px solid #ffc83d; border-radius:6px; padding:6px 10px; cursor:pointer; }
</style>
</head>
<body>
<div id="bar">
  <button data-e="gift">🎁 Cadeau</button><button data-e="lightning">⚡ Foudre</button><button data-e="meteors">☄️ Météores</button>
  <button data-e="heartRain">❤️ Cœurs</button><button data-e="bossSpawn">👹 Titan</button><button data-e="bossDown">🏅 Titan vaincu</button><button data-e="roundEnd">🏆 Victoire</button>
</div>
<div id="gl"></div>
<script type="module">
import { createArena } from '/arena3d.js';
// Page de démonstration : scène fictive (aucune donnée réelle) pour montrer les visuels sans live.
const A = createArena(document.getElementById('gl'));
const names = ['karim_67', 'juliette', 'hamza_59', 'nour.b', 'ilyes_k', 'lea_gaming', 'tom.d', 'yasmine', 'nathan46', 'sofia_x', 'enzo_r', 'camille', 'bilal.p', 'manon_77'];
const powers = ['legende', null, 'berserk', 'foudre', 'vampire', null, 'epee', null, 'bouclier', null, 'epee', null, 'foudre', null];
const state = { phase: 'fight', winner: null, boss: { name: 'TITAN', hp: 230, max: 330 },
  players: names.map((n, i) => ({ id: n, name: n, hp: 40 + (i * 37) % 60, maxHp: 100, power: powers[i], shield: powers[i] === 'bouclier', alive: true, kills: i % 4 })) };
const push = () => A.setState(state);
push();
const fire = (type) => {
  const e = { type, name: names[Math.floor(Math.random() * names.length)], coins: 500, power: 'legende', mvp: 'ilyes_k', winner: 'ilyes_k', kills: 5 };
  if (type === 'bossSpawn') { state.boss = { name: 'TITAN', hp: 330, max: 330 }; push(); }
  if (type === 'bossDown') { state.boss = null; push(); }
  A.onEvent(e);
};
document.querySelectorAll('button').forEach((b) => b.onclick = () => fire(b.dataset.e));
const q = new URLSearchParams(location.search).get('auto');
if (q) { // ?auto=1 : enchaîne les effets tout seul
  const seq = ['gift', 'lightning', 'meteors', 'heartRain'];
  let i = 0; setInterval(() => fire(seq[i++ % seq.length]), 3500);
}
setInterval(() => { if (state.boss) { state.boss.hp = Math.max(20, state.boss.hp - 6); push(); } }, 1000);
</script>
</body>
</html>
