<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arène des viewers — Overlay</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
<style>
  #gl { position:absolute; inset:0; }
  html, body { margin:0; height:100%; background:#0d0508; overflow:hidden; font-family:Impact,'Arial Black',sans-serif; color:#fff; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, 56.25vh); height:min(100vh, 222.2vw); container-type:size; margin:0 auto; background:#1a0b10; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .abs { position:absolute; left:0; right:0; text-align:center; text-shadow:0 .3cqh 0 #000, 0 0 1.2cqh #000; pointer-events:none; }
  #top { top:1.2%; font-size:min(3cqh, 6cqw); color:#ffc83d; letter-spacing:.2cqh; }
  #timer { top:4.2%; font-size:min(6.2cqh, 12cqw); }
  #sub { top:11.8%; font-size:min(1.9cqh, 3.3cqw); white-space:nowrap; font-family:Arial,sans-serif; font-weight:800; margin:0 5%; padding:.8cqh 2.5cqw; box-sizing:border-box; text-align:center; background:linear-gradient(#ffd84d,#f5a300); color:#3a1a00; border-radius:5cqh; text-shadow:none; border:.3cqh solid #fff3; }
  #banner { top:34%; font-size:min(10cqh, 19cqw); line-height:1; color:#ffe27a; opacity:0; transform:scale(.6); transition:all .35s cubic-bezier(.2,1.6,.4,1); }
  #banner.show { opacity:1; transform:scale(1); }
  #banner small { display:block; font-size:min(3cqh, 5.6cqw); color:#fff; }
  .box { background:#2a1420e6; border:.25cqh solid #ffb347; border-radius:1.4cqh; box-sizing:border-box; }
  #bottom { position:absolute; left:2.5%; right:2.5%; bottom:1.2%; display:flex; flex-direction:column; gap:.9cqh; font-family:Arial,sans-serif; }
  #speech { display:flex; align-items:flex-end; gap:1cqh; height:12.5cqh; }
  #waifu { flex:none; width:10.2cqh; height:12.5cqh; filter:drop-shadow(0 .4cqh .6cqh #000a); }
  #say { flex:1; align-self:center; font-size:min(1.9cqh, 3.5cqw); font-weight:800; line-height:1.25; padding:1cqh 1.4cqh; background:#000b; border-radius:1.6cqh; border:.2cqh solid #ffc83d66; opacity:0; transition:opacity .3s; max-height:11.5cqh; overflow:hidden; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; text-shadow:none; }
  #say.show { opacity:1; }
  #say b { color:#ffc83d; }
  #heart { position:relative; height:3cqh; border-radius:1.5cqh; background:#2a0a14; border:.25cqh solid #ff4d6d; overflow:hidden; }
  #heart i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ff2d55,#ff7a9a); transition:width .4s; }
  #heartTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.6cqh; font-weight:800; text-shadow:0 .2cqh 0 #000; }
  #powers { display:grid; grid-template-columns:repeat(6,1fr); gap:.8cqh; }
  #powers .card { height:11.2cqh; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:.7cqh .3cqh; text-align:center; overflow:hidden; }
  #powers .ico { height:4.2cqh; width:4.2cqh; display:flex; align-items:center; justify-content:center; font-size:3.6cqh; line-height:1; }
  #powers .ico img { max-height:100%; max-width:100%; object-fit:contain; }
  #powers .row { width:100%; white-space:nowrap; overflow:hidden; font-size:1.45cqh; font-weight:700; display:flex; align-items:center; justify-content:center; gap:.4cqh; height:1.9cqh; text-shadow:none; }
  #powers .gname { font-family:Impact,'Arial Black',sans-serif; font-size:1.6cqh; color:#fff; }
  #powers .coin { color:#ffd54a; }
  #info { display:grid; grid-template-columns:1.15fr .85fr; gap:.8cqh; }
  #info .box { height:8.2cqh; padding:.8cqh 1.2cqh; font-size:1.5cqh; font-weight:700; overflow:hidden; line-height:1.4; text-align:left; }
  #info .t { color:#ffc83d; }
  #info .l { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .av { width:2.2cqh; height:2.2cqh; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:.5cqh; border:.2cqh solid #ffc83d; }
  .avbig { width:13cqh; height:13cqh; border-radius:50%; object-fit:cover; border:.6cqh solid #ffc83d; display:block; margin:0 auto 1cqh; box-shadow:0 0 3cqh #ffc83d; }
  html, body { cursor:default; user-select:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="gl"></div>
  <canvas id="cv"></canvas>
  <div class="abs" id="top">L'ARÈNE DES VIEWERS</div>
  <div class="abs" id="timer"></div>
  <div class="abs" id="sub">🗡️ UN CADEAU = UN POUVOIR AU DÉPART</div>
  <div class="abs" id="banner"></div>
  <div id="bottom">
    <div id="speech"><div id="waifu"></div><div id="say"></div></div>
    <div id="heart"><i></i><span id="heartTxt"></span></div>
    <div id="powers"></div>
    <div id="info"><div class="box" id="elim"></div><div class="box" id="top3"></div></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const ICON = { epee:'🗡️', bouclier:'🛡️', berserk:'🔥', vampire:'🧛', foudre:'⚡', legende:'☄️' };
// Barème : de vrais cadeaux TikTok -> pouvoir. Il vient du serveur (src/config.js) ; en live, image et prix
// réels du catalogue TikTok. On le rafraîchit régulièrement (le catalogue arrive après la connexion).
const NAMES = { epee: 'Épée', bouclier: 'Bouclier', berserk: 'Berserk', vampire: 'Vampire', foudre: 'Foudre', legende: 'Légende' };
const avUrl = (u) => (u ? (u.startsWith('data:') ? u : '/api/img?u=' + encodeURIComponent(u)) : '');
let CFG = { showAvatars: true };
function loadBareme() {
  fetch('/api/config').then((r) => r.json()).then((c) => {
    CFG = c;
    if (c.voice) applyVoiceSettings(c.voice);
    $('powers').innerHTML = c.bareme.map((g) => `<div class="card box"><div class="ico">${g.image ? `<img src="${g.image}" alt="">` : g.emoji}</div>
      <div class="row gname">${g.gift.toUpperCase()}</div><div class="row coin">🪙 ${g.coins}</div><div class="row pw">${ICON[g.power] ?? ''} ${NAMES[g.power] ?? ''}</div></div>`).join('');
    fitRows();
  }).catch(() => {});
}
// même taille de texte sur toutes les cartes : on réduit jusqu'à ce que la plus longue tienne sur UNE ligne
function fitRows() {
  for (const cls of ['gname', 'coin', 'pw']) {
    const rows = [...document.querySelectorAll('#powers .' + cls)];
    let f = Math.max(...rows.map((r) => parseFloat(getComputedStyle(r).fontSize)), 8);
    while (f > 7 && rows.some((r) => { r.style.fontSize = f + 'px'; return r.scrollWidth > r.clientWidth + 1; })) f -= .5;
    rows.forEach((r) => { r.style.fontSize = f + 'px'; });
  }
}
new ResizeObserver(() => requestAnimationFrame(fitRows)).observe($('stage'));
loadBareme(); setInterval(loadBareme, 20000);

// mascotte (SVG animé) : yeux, bouche synchronisée avec la voix, réactions
let WF = null;
import('/waifu.js').then((m) => { WF = m.createWaifu($('waifu')); }).catch((err) => console.warn('mascotte indisponible :', err.message));

let S = null, kills = [], flashes = [], fx = [];
// Arène 3D (three.js). Si WebGL n'est pas dispo, on retombe sur l'arène 2D ci-dessous.
let A3 = null;
Promise.all([import('/arena3d.js'), fetch('/api/config').then((r) => r.json()).catch(() => ({ showAvatars: true }))])
  .then(([m, cfg]) => { A3 = m.createArena($('gl'), { avatars: cfg.showAvatars !== false }); $('cv').style.display = 'none'; if (S) A3.setState(S); })
  .catch((err) => console.warn('3D indisponible, arène 2D utilisée :', err.message));
const cv = $('cv'), ctx = cv.getContext('2d');
const pos = new Map(); // id -> {x,y,a,r} position animée
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

function banner(html, ms = 3500) { const b = $('banner'); b.innerHTML = html; b.classList.add('show'); clearTimeout(b.t); b.t = setTimeout(() => b.classList.remove('show'), ms); }

// ---------- voix (Web Speech API) : tout se règle dans le BACKSTAGE (onglet Réglages) ----------
const Q = new URLSearchParams(location.search); // (facultatif, prioritaire) ?voice=denise&pitch=1.6&rate=1.1
let VS = { enabled: true, volume: 1, pitch: 1.55, rate: 1, voiceName: '' }; // réglages reçus du serveur
let unlocked = false;
// Un navigateur n'autorise le son qu'après une interaction : le 1er clic ou la 1re touche dans la fenêtre l'active (aucun bouton à l'écran)
function unlock() {
  if (unlocked) return;
  unlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch {}
  heartbeat();
  if (VS.enabled) speak('Coucou les gladiateurs ! Maxima est en ligne, préparez-vous, ça va être super !', 'lobby');
}
for (const ev of ['pointerdown', 'keydown', 'touchstart']) addEventListener(ev, unlock, { once: true, passive: true });
const canSpeak = () => unlocked && VS.enabled && 'speechSynthesis' in window;
function applyVoiceSettings(v) { // v : { enabled, volume, pitch, rate, voiceName }
  VS = { ...VS, ...v };
  if (!VS.enabled && 'speechSynthesis' in window) speechSynthesis.cancel(); // « Voix coupée » dans le backstage : silence immédiat
}
const EXCITED = new Set(['kill', 'kills', 'carnage', 'bossSpawn', 'bossDown', 'roundEnd', 'finalDuel', 'streak', 'lightning', 'meteors', 'heartRain', 'fightStart', 'hazard', 'shieldSave']);
// voix féminine française : les voix « Natural / Online » (Edge : Denise, Eloise…) sonnent bien mieux que les anciennes
function pickVoice() {
  const fr = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith('fr'));
  const want = (Q.get('voice') || VS.voiceName || '').toLowerCase();
  if (want) { const v = fr.find((x) => x.name.toLowerCase().includes(want)); if (v) return v; }
  const FEM = /denise|eloise|hortense|julie|amelie|amélie|marie|audrey|celine|céline|léa|lea|female|femme|google fran/i;
  const MALE = /henri|paul|thomas|claude|antoine|remy|rémy|\bmale\b/i;
  const rank = (v) => (/natural|online/i.test(v.name) ? 0 : 2) + (FEM.test(v.name) ? 0 : 1) + (MALE.test(v.name) ? 5 : 0);
  return [...fr].sort((x, y) => rank(x) - rank(y))[0] ?? null;
}
// on ne lit ni les emojis, ni les symboles, ni les "!!!" répétés
const cleanSpeech = (t) => t.replace(/@/g, '').replace(/[\p{Extended_Pictographic}\u200d\ufe0f]/gu, '').replace(/[*_~`#]/g, '').replace(/([!?])\1+/g, '$1').replace(/\s+/g, ' ').trim();
function speak(text, kind) {
  if (!canSpeak()) return;
  const clean = cleanSpeech(text);
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.voice = pickVoice(); u.lang = 'fr-FR'; u.volume = VS.volume;
  const hype = EXCITED.has(kind);
  // voix aiguë et pétillante ; encore plus aiguë et rapide pendant l'action, légèrement montante sur les questions
  u.pitch = Math.min(2, (+Q.get('pitch') || VS.pitch) + (hype ? 0.2 : 0) + (/\?/.test(clean) ? 0.1 : 0));
  u.rate = (+Q.get('rate') || VS.rate) * (hype ? 1.22 : 1.1);
  if (speechSynthesis.speaking && speechSynthesis.pending) speechSynthesis.cancel(); // pas de retard cumulé
  u.onstart = () => WF?.talk(true); u.onend = u.onerror = () => WF?.talk(false);
  speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged = () => {};

function say(s) {
  const el = $('say'); el.innerHTML = `<b>${(s.name || 'MAXIMA').toUpperCase()}</b> · ${s.text.replace(/</g, '&lt;')}`; el.classList.add('show');
  clearTimeout(el.t); el.t = setTimeout(() => el.classList.remove('show'), 7000);
  if (!canSpeak()) WF?.talkFor(s.text); // voix coupée ou pas encore débloquée : elle bouge quand même la bouche
  speak(s.text, s.kind);
}

const escH = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function onEvt(e) {
  A3?.onEvent(e);
  for (const k of ['name', 'winner', 'mvp', 'a', 'b', 'victim', 'killer', 'giftName']) if (typeof e[k] === 'string') e[k] = escH(e[k]); // pseudos injectés en HTML ci-dessous
  switch (e.type) {
    case 'bossSpawn': banner('👹 LE TITAN ARRIVE !<small>Unissez-vous !</small>', 4500); break;
    case 'bossDown': banner(`TITAN VAINCU !<small>MVP : ${e.mvp ?? '—'}</small>`, 5000); break;
    case 'kill': kills.unshift(e); kills = kills.slice(0, 4); flashes.push({ name: e.victim, t: 1 }); break;
    case 'finalDuel': banner(`DUEL FINAL<small>${e.a} VS ${e.b}</small>`, 5000); break;
    case 'carnage': banner('CARNAGE !'); fx.push({ type: 'shake', t: 1 }); break;
    case 'roundEnd': banner(`${CFG.showAvatars && e.winnerAvatar ? `<img class="avbig" src="${avUrl(e.winnerAvatar)}" alt="">` : ''}${(e.winner ?? '—').toUpperCase()}<small>GAGNE LA MANCHE · ${e.kills} éliminations</small>`, 8000); fx.push({ type: 'confetti', t: 1 }); break;
    case 'fightStart': banner('COMBAT !', 2500); break;
    case 'lobby': banner(`ROUND ${e.round}<small>Écris un commentaire pour entrer !</small>`, 4000); break;
    case 'lightning': banner('⚡ FOUDRE ⚡<small>' + e.name + '</small>', 3000); fx.push({ type: 'flash', t: 1, c: '#c9a8ff' }); break;
    case 'meteors': banner('☄️ MÉTÉORES ☄️<small>' + e.name + '</small>', 3000); fx.push({ type: 'flash', t: 1, c: '#ff7a2e' }); break;
    case 'heartRain': banner('❤️ PLUIE DE CŒURS ❤️', 3000); fx.push({ type: 'hearts', t: 1 }); break;
    case 'hazard': banner(e.kind.toUpperCase() + ' !', 3000); fx.push({ type: 'shake', t: 1 }); break;
    case 'streak': banner(`🔥 ${e.name} EN FEU<small>${e.kills} éliminations</small>`, 3000); break;
    case 'power': banner(`${ICON[e.power] ?? ''} ${e.name}<small>obtient ${(NAMES[e.power] ?? e.power).toUpperCase()}${e.later ? ' · déchaîné au début du combat' : ''}</small>`, 2600); break;
  }
  const R = { kill: ['shock', 1100], carnage: ['scared', 2500], gift: [e.spectator ? 'happy' : 'heart', 2200], power: ['happy', 1800], bossSpawn: ['scared', 3800], bossDown: ['happy', 4000],
    roundEnd: ['heart', 5000], heartRain: ['heart', 2600], lightning: ['shock', 1800], meteors: ['shock', 2000], hazard: ['shock', 1600], finalDuel: ['shock', 2500],
    streak: ['smug', 2000], shieldSave: ['shock', 1300], lobby: ['happy', 2500], fightStart: ['smug', 2000] }[e.type];
  if (R) WF?.react(R[0], R[1]);
}

// ---------- rendu ----------
function resize() { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

function draw(now) {
  if (A3) { ctx.clearRect(0, 0, cv.width, cv.height); requestAnimationFrame(draw); return; } // la 3D s'en charge
  const W = cv.width, H = cv.height, cx = W / 2, cy = H * 0.45, R = W * 0.46;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sh = fx.find((f) => f.type === 'shake');
  if (sh) ctx.translate((Math.random() - .5) * 14 * sh.t, (Math.random() - .5) * 14 * sh.t);
  // sol de l'arène
  const g = ctx.createRadialGradient(cx, cy, R * .1, cx, cy, R);
  g.addColorStop(0, '#f5b25e'); g.addColorStop(.7, '#c4713a'); g.addColorStop(1, '#6a2e1a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.lineWidth = W * .02; ctx.strokeStyle = '#3a160e'; ctx.stroke();
  ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R * .55, 0, 7); ctx.stroke();
  if (S) {
    const ps = S.players, n = Math.max(ps.length, 1);
    const size = Math.max(W * (n > 40 ? .035 : n > 20 ? .05 : .075), 10);
    ps.forEach((p, i) => {
      let o = pos.get(p.id);
      if (!o) pos.set(p.id, (o = { x: cx, y: cy, ph: Math.random() * 7 }));
      // lobby : cercle ; combat : les survivants se rapprochent du centre
      const alive = ps.filter((q) => q.alive).length;
      const ring = S.phase === 'fight' ? R * (.25 + .6 * Math.min(1, alive / Math.max(n, 1))) : R * .72;
      const ang = (i / n) * 6.283 + now / 6000 * (S.phase === 'fight' ? 1 : .2);
      const tx = cx + Math.cos(ang) * ring + Math.sin(now / 400 + o.ph) * size * .25;
      const ty = cy + Math.sin(ang) * ring + Math.cos(now / 450 + o.ph) * size * .25;
      o.x += (tx - o.x) * .08; o.y += (ty - o.y) * .08;
      ctx.globalAlpha = p.alive ? 1 : .35;
      const col = `hsl(${hue(p.id)} 70% 55%)`;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(o.x, o.y, size * .5, 0, 7); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = p.power ? '#ffd84d' : '#fff8'; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `bold ${size * .5}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.alive ? (ICON[p.power] ?? p.name[0].toUpperCase()) : '💀', o.x, o.y);
      if (p.alive) { // barre de vie + pseudo
        ctx.fillStyle = '#000a'; ctx.fillRect(o.x - size * .5, o.y + size * .58, size, size * .14);
        ctx.fillStyle = p.hp / p.maxHp > .35 ? '#4ade80' : '#ff4d5e'; ctx.fillRect(o.x - size * .5, o.y + size * .58, size * p.hp / p.maxHp, size * .14);
        if (n <= 30) { ctx.fillStyle = '#fff'; ctx.font = `bold ${size * .28}px Arial`; ctx.fillText(p.name.slice(0, 10), o.x, o.y + size * .95); }
        if (p.shield) { ctx.strokeStyle = '#6ec8ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(o.x, o.y, size * .62, 0, 7); ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
    });
    for (const f of flashes) { const o = [...pos.entries()].find(([id]) => S.players.find((p) => p.id === id && p.name === f.name)); if (o) { ctx.strokeStyle = `rgba(255,60,60,${f.t})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(o[1].x, o[1].y, size * (1 - f.t + .5), 0, 7); ctx.stroke(); } f.t -= .03; }
    flashes = flashes.filter((f) => f.t > 0);
  }
  // effets plein écran
  for (const f of fx) {
    if (f.type === 'flash') { ctx.fillStyle = f.c + Math.floor(f.t * 120).toString(16).padStart(2, '0'); ctx.fillRect(0, 0, W, H); }
    if (f.type === 'confetti' || f.type === 'hearts') {
      f.p ??= Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: -Math.random() * H * .5, v: 2 + Math.random() * 5, c: `hsl(${Math.random() * 360} 90% 60%)` }));
      for (const q of f.p) { q.y += q.v * devicePixelRatio; ctx.fillStyle = q.c; if (f.type === 'hearts') { ctx.font = `${W * .05}px serif`; ctx.fillText('❤️', q.x, q.y); } else ctx.fillRect(q.x, q.y, 8, 14); }
    }
    f.t -= f.type === 'confetti' ? .004 : .02;
  }
  fx = fx.filter((f) => f.t > 0);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function hud(s) {
  S = s; A3?.setState(s);
  const alive = s.players.filter((p) => p.alive).length;
  $('timer').textContent = s.phase === 'lobby' ? (s.players.length < 2 ? 'EN ATTENTE…' : s.timer + 's') : s.phase === 'fight' ? `${alive} EN VIE` : 'FIN';
  $('heart').firstElementChild.style.width = (100 * s.heart / s.heartGoal) + '%';
  $('heartTxt').textContent = `❤️ ${s.heart} / ${s.heartGoal} · PLUIE DE CŒURS`;
  // 3 lignes par boîte, une info par ligne, jamais de retour à la ligne
  const line = (h) => `<div class="l">${h}</div>`;
  $('elim').innerHTML = line('<span class="t">💀 ÉLIMINATIONS</span>') + (kills.slice(0, 2).map((k) => line(`${k.killer ?? '🌪️'} ⚔ ${k.victim}`)).join('') || line('…'));
  $('top3').innerHTML = line('<span class="t">🏆 TOP VICTOIRES</span>') + (s.leaderboard.slice(0, 2).map((u) => line(`${CFG.showAvatars && u.avatar ? `<img class="av" src="${avUrl(u.avatar)}" alt="">` : ''}${u.name.replace(/</g, '&lt;')} · ${u.wins}`)).join('') || line('…'));
  for (const id of pos.keys()) if (!s.players.find((p) => p.id === id)) pos.delete(id);
}

// ---------- encadré jaune : le texte tient TOUJOURS sur une ligne, quelle que soit la taille de la fenêtre ----------
function fitPill() {
  const el = $('sub');
  el.style.fontSize = '';
  let f = parseFloat(getComputedStyle(el).fontSize);
  while (f > 7 && el.scrollWidth > el.clientWidth) { f -= .5; el.style.fontSize = f + 'px'; }
}
new ResizeObserver(() => requestAnimationFrame(fitPill)).observe($('stage'));
document.fonts?.ready.then(fitPill); fitPill();

// ---------- état envoyé au backstage toutes les 5 s (overlay ouvert ? voix débloquée ? images/s ?) ----------
function heartbeat() {
  const st = A3?.stats?.() ?? { fps: 0, quality: 0, glads: 0 };
  const voices = 'speechSynthesis' in window ? speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith('fr')).map((v) => v.name) : [];
  fetch('/api/overlay', { method: 'POST', headers: { 'X-Arena': '1' }, body: JSON.stringify({ unlocked, voices, voiceUsed: unlocked ? pickVoice()?.name ?? '' : '', fps: st.fps, quality: st.quality, glads: st.glads }) }).catch(() => {});
}
setInterval(heartbeat, 5000); heartbeat();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = heartbeat; // la liste des voix arrive en retard sur Chrome/Edge

const es = new EventSource('/events');
// réglages modifiés dans le backstage : appliqués tout de suite
es.addEventListener('settings', (m) => { const s = JSON.parse(m.data); applyVoiceSettings({ enabled: s.voiceEnabled, volume: s.volume, pitch: s.pitch, rate: s.rate, voiceName: s.voiceName }); });
es.addEventListener('init', (m) => { const s = JSON.parse(m.data).settings; if (s) applyVoiceSettings({ enabled: s.voiceEnabled, volume: s.volume, pitch: s.pitch, rate: s.rate, voiceName: s.voiceName }); });
// « Tester la voix » dans le backstage
es.addEventListener('cmd', (m) => { if (JSON.parse(m.data).type === 'testVoice') { const t = 'Coucou ! Ceci est un test de ma voix. Je suis prête pour le combat, hihi !'; WF?.react('happy', 3000); if (canSpeak()) speak(t, 'lobby'); else WF?.talkFor(t); } });
es.addEventListener('state', (m) => hud(JSON.parse(m.data)));
es.addEventListener('evt', (m) => onEvt(JSON.parse(m.data)));
es.addEventListener('say', (m) => say(JSON.parse(m.data)));
</script>
</body>
